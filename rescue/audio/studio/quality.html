<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinimalPairs · Audio check</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#24241f;font:16px system-ui}main{max-width:600px;margin:5vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font:28px Georgia;margin:0}select,button{font:inherit;border:1px solid #d6d0c4;border-radius:8px;padding:12px;background:#fff;cursor:pointer}.filters{display:flex;gap:10px;margin-bottom:24px}.filters select{max-width:50%;flex:1}.card{background:#fffdf7;border:1px solid #ded8cc;border-radius:20px;padding:32px;text-align:center}#word{font:52px Georgia;margin:16px 0 10px;overflow-wrap:anywhere}#ipa{font-size:23px;color:#526777}#context,#position,#flags{color:#716e65;font-size:14px;line-height:1.6}audio{width:100%;margin:24px 0}.actions{display:flex;gap:12px}.actions button{flex:1}#pass{background:#2f6149;color:white}#reject{background:#9a453a;color:white}button:disabled{opacity:.4;cursor:default}.secondary{display:flex;justify-content:space-between;margin-top:20px}.secondary button{background:transparent;border:0;padding:8px}#message{min-height:24px;color:#9a453a}details{text-align:left;font-size:12px;margin-top:24px;overflow-wrap:anywhere}footer{text-align:center;color:#716e65;font-size:13px;line-height:1.8;margin-top:22px}#empty{padding:30px;text-align:center}
</style><main><header><h1>Audio check</h1><span id="position"></span></header><div class="filters"><select id="bank" aria-label="Language"><option value="">All languages</option></select><select id="scope" aria-label="Review queue"><option value="production">Live library · unfinished</option><option value="production-all">Live library · include passed</option><option value="production-high">Live library · priority flags</option><option value="followup">Finish review</option><option value="triage-high">Priority listening</option><option value="triage-lower">Lower priority</option><option value="sample">Launch sample</option><option value="priority">Next review</option><option value="replacements">New replacements</option><option value="layer2">Second audit flags</option><option value="flagged">Flagged only</option><option value="all">All unreviewed</option><option value="reject">Rejected</option><option value="pass">Passed</option></select></div><p id="production-status" role="status"></p><button id="restart-sweep" hidden>Listen again from the beginning</button><p id="save-status" role="status" aria-live="polite">Reviews save automatically after Pass or Reject.</p><div id="empty" hidden></div><section class="card" id="card"><div id="context"></div><h2 id="word"></h2><div id="ipa"></div><p id="meaning"></p><audio id="audio" controls preload="auto"></audio><div class="actions"><button id="reject">Reject · R</button><button id="pass" disabled>Pass · P</button></div><div class="secondary"><button id="undo" disabled>Undo</button><button id="skip">Skip →</button></div><p id="message" role="status"></p><p id="flags"></p><details><summary>Clip details</summary><p id="identity"></p></details></section><footer>Space: replay · P: pass · R: reject · →: skip<br>Decisions save on this Mac. Passing requires listening to the whole clip.</footer></main><script>
const $=id=>document.getElementById(id), names={'en-US-ga':'American English','en-GB-ssbe':'British English',fr:'French',de:'German',es:'Spanish',it:'Italian',zh:'Mandarin',pt:'Portuguese',ru:'Russian',ja:'Japanese'};
let clips=[],queue=[],current=null,last=null,saving=false,heard=false,covered=0,lastTime=0,sessionToken='__TOKEN__',syncing=false,revision=0;
const key=c=>c?c.id+':'+c.sha:'';
let productionInfo={},sweepSeen=new Set(JSON.parse(sessionStorage.getItem('mp-production-sweep')||'[]'));
function productionMode(){return $('scope').value.startsWith('production');}
function noteSweep(c){sweepSeen.add(key(c));sessionStorage.setItem('mp-production-sweep',JSON.stringify([...sweepSeen]));}
function productionStatus(){const live=clips.filter(c=>c.production&&(!$('bank').value||c.bank===$('bank').value));$('restart-sweep').hidden=$('scope').value!=='production-all';$('production-status').hidden=!productionMode();$('production-status').textContent=productionInfo.fetchedAt?`${live.length} live recordings · ${live.filter(c=>c.review==='pass').length} passed · ${live.filter(c=>c.review==='unreviewed').length} awaiting review. Library checked ${new Date(productionInfo.fetchedAt).toLocaleString()}.`+(productionInfo.missingLocal?' Some live recordings need a local scan before review.':''):'Live library has not been synchronized yet. No development recordings are shown.';}

function busy(value){if(value)revision++;saving=value;for(const id of ['reject','skip','bank','scope','restart-sweep'])$(id).disabled=value;$('pass').disabled=value||!heard;$('undo').disabled=value||!last;}
async function fetchQueue(){const r=await fetch('/api/queue',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('Could not refresh. Your saved reviews remain on this Mac.');const data=await r.json();if(!Array.isArray(data.clips))throw Error('Invalid review response. Nothing was changed.');if(data.sessionToken)sessionToken=data.sessionToken;productionInfo=data.production||{};return data;}
async function syncQueue(){if(saving||syncing)return;syncing=true;const started=revision;try{const data=await fetchQueue();if(saving||revision!==started)return;const before=key(current),wasHeard=heard,oldCovered=covered,oldTime=lastTime;clips=data.clips;refresh(true);if(before===key(current)){heard=wasHeard;covered=oldCovered;lastTime=oldTime;$('pass').disabled=!heard;}}catch(e){$('save-status').textContent=e.message;}finally{syncing=false;}}
async function load(){const data=await fetchQueue();clips=data.clips;for(const bank of [...new Set(clips.map(c=>c.bank))]){const o=document.createElement('option');o.value=bank;o.textContent=names[bank]||bank;$('bank').append(o);}const params=new URLSearchParams(location.search);$('scope').value=['production','production-all','production-high','sample','triage-high','triage-lower','followup'].includes(params.get('scope'))?params.get('scope'):'priority';if(params.get('bank'))$('bank').value=params.get('bank');refresh();}
function refresh(preserve=false){if(saving)return;const before=current;productionStatus();queue=clips.filter(c=>(!$('bank').value||c.bank===$('bank').value)&&(productionMode()?c.production&&c.review!=='reject'&&($('scope').value==='production-all'?!sweepSeen.has(key(c)):c.review==='unreviewed')&&($('scope').value!=='production-high'||['high','needs_audit'].includes(c.triage?.priority)||c.customerReported):$('scope').value==='pass'||$('scope').value==='reject'?c.review===$('scope').value:c.review==='unreviewed'&&($('scope').value!=='followup'||c.nextReview)&&($('scope').value!=='triage-high'||['high','needs_audit'].includes(c.triage?.priority))&&($('scope').value!=='triage-lower'||c.triage?.priority==='lower')&&($('scope').value!=='sample'||c.launchSample)&&($('scope').value!=='flagged'||c.flags.length>0)&&($('scope').value!=='replacements'||c.replacement)&&($('scope').value!=='layer2'||c.layer2?.flags.length)&&($('scope').value!=='priority'||c.replacement||c.nextReview||c.layer2?.flags.some(f=>f.includes('repeat'))))).sort((a,b)=>Number(Boolean(b.customerReported))-Number(Boolean(a.customerReported))||(productionMode()?Number(['high','needs_audit'].includes(b.triage?.priority))-Number(['high','needs_audit'].includes(a.triage?.priority)):0)||($('scope').value==='priority'?Number(Boolean(b.replacement))-Number(Boolean(a.replacement)):$('scope').value==='flagged'?b.flags.length-a.flags.length:0));if(preserve&&before){const index=queue.findIndex(c=>key(c)===key(before));if(index>=0){const [same]=queue.splice(index,1);queue.unshift(same);current=same;$('position').textContent=`${queue.length} left`;return;}}show(false);}
function show(autoplay=true){current=queue[0];heard=false;covered=0;lastTime=0;$('pass').disabled=true;$('message').textContent='';$('position').textContent=`${queue.length} left`;$('card').hidden=!current;$('empty').hidden=Boolean(current);if(!current){$('audio').pause();$('empty').textContent='This queue is complete.';return;}$('context').textContent=`${names[current.bank]||current.bank} · Voice ${current.voice}`;$('word').textContent=current.text;$('ipa').textContent=current.ipa;$('meaning').textContent=current.meaning||'';$('flags').textContent=(current.triage?current.triage.reason+' · ':'')+(current.flags.length?'Check: '+current.flags.map(f=>f.replaceAll('_',' ')).join(' · '):'');$('identity').textContent=`Clip ${current.id} · SHA ${current.sha}`+(current.layer2?' · Machine transcript: '+(current.layer2.transcript||'(none)'):'');$('audio').src='/audio/'+current.id;if(autoplay)$('audio').play().catch(()=>{$('message').textContent='Press play to listen.';});}
$('audio').ontimeupdate=()=>{const t=$('audio').currentTime,delta=t-lastTime;if(delta>0&&delta<.7)covered+=delta;lastTime=t;};$('audio').onseeking=()=>{lastTime=$('audio').currentTime;};$('audio').onended=()=>{if(covered>=$('audio').duration*.9){heard=true;$('pass').disabled=saving;}};$('audio').onerror=()=>{$('message').textContent='Audio unavailable or changed. Run the scan again.';};
async function save(c,decision){
 const send=()=>fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-QA-Token':sessionToken},body:JSON.stringify({id:c.id,sha:c.sha,decision}),signal:AbortSignal.timeout(10000)});
 let r=await send();
 if(r.status===403){const data=await fetchQueue();if(!data.clips.some(item=>key(item)===key(c)))throw Error('This recording was replaced. Refresh the queue to hear the new version.');r=await send();}
 if(!r.ok)throw Error(r.status===409?'This recording changed. Refresh the queue before reviewing it.':'Not saved. Please try Pass or Reject again; this clip has not been skipped.');
 const result=await r.json();if(result.saved!==true)throw Error('Save was not confirmed. This clip has not been skipped.');
}
async function decide(decision){if(!current||saving||(decision==='pass'&&!heard))return;busy(true);const reviewed=current;$('save-status').textContent='Saving '+reviewed.text+'…';try{await save(reviewed,decision);last={clip:reviewed,previous:reviewed.review,previousProduction:reviewed.production};reviewed.review=decision;if(productionMode()){noteSweep(reviewed);if(decision==='reject')reviewed.production=false;productionStatus();}queue=queue.filter(c=>key(c)!==key(reviewed));show();$('save-status').textContent='Saved: '+reviewed.text+' — '+(decision==='pass'?'passed':'rejected')+'.';}catch(e){$('message').textContent=e.message;$('save-status').textContent='Not confirmed. Stay on this clip and retry; saved reviews are never cleared.';}finally{busy(false);}}
$('pass').onclick=e=>{if(e.detail>1)return;decide('pass');};$('reject').onclick=e=>{if(e.detail>1)return;decide('reject');};$('skip').onclick=()=>{if(saving||!current)return;queue.push(queue.shift());show();$('save-status').textContent='Skipped for now — no decision saved.';};$('undo').onclick=async()=>{if(!last||saving)return;busy(true);$('save-status').textContent='Saving undo…';try{await save(last.clip,last.previous);const restored=clips.find(c=>key(c)===key(last.clip))||last.clip;restored.review=last.previous;restored.production=Boolean(restored.productionEligible??last.previousProduction)&&restored.review!=='reject';productionStatus();sweepSeen.delete(key(restored));sessionStorage.setItem('mp-production-sweep',JSON.stringify([...sweepSeen]));queue=queue.filter(c=>key(c)!==key(restored));if(!productionMode()||restored.production)queue.unshift(restored);last=null;show();$('save-status').textContent='Undo saved.';}catch(e){$('message').textContent=e.message;$('save-status').textContent='Undo was not confirmed. Retry when connected.';}finally{busy(false);}};
$('bank').onchange=$('scope').onchange=()=>{const params=new URLSearchParams({scope:$('scope').value});if($('bank').value)params.set('bank',$('bank').value);history.replaceState(null,'','?'+params);refresh();};$('restart-sweep').onclick=()=>{sweepSeen.clear();sessionStorage.removeItem('mp-production-sweep');refresh();};
document.addEventListener('keydown',e=>{if(saving)return;if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'){e.preventDefault();$('audio').currentTime=0;lastTime=0;covered=0;heard=false;$('pass').disabled=true;$('audio').play();}if(e.key.toLowerCase()==='p'){e.preventDefault();decide('pass');}if(e.key.toLowerCase()==='r'){e.preventDefault();decide('reject');}if(e.key==='ArrowRight'){e.preventDefault();$('skip').click();}});load().catch(e=>{$('message').textContent='Could not load the review queue.';$('save-status').textContent='Could not connect. Your saved reviews remain on this Mac. Refresh to retry.';});
window.addEventListener('focus',syncQueue);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncQueue();});setInterval(()=>{if(!document.hidden&&!saving&&$('audio').paused)syncQueue();},30000);
window.addEventListener('beforeunload',e=>{if(saving){e.preventDefault();e.returnValue='A review is still saving.';}});
</script></html>
