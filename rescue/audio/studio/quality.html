<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinimalPairs · Audio check</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#24241f;font:16px system-ui}main{max-width:600px;margin:5vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font:28px Georgia;margin:0}select,button{font:inherit;border:1px solid #d6d0c4;border-radius:8px;padding:12px;background:#fff;cursor:pointer}.filters{display:flex;gap:10px;margin-bottom:24px}.filters select{max-width:50%;flex:1}.card{background:#fffdf7;border:1px solid #ded8cc;border-radius:20px;padding:32px;text-align:center}#word{font:52px Georgia;margin:16px 0 10px;overflow-wrap:anywhere}#ipa{font-size:23px;color:#526777}#context,#position,#flags{color:#716e65;font-size:14px;line-height:1.6}audio{width:100%;margin:24px 0}.actions{display:flex;gap:12px}.actions button{flex:1}#pass{background:#2f6149;color:white}#reject{background:#9a453a;color:white}button:disabled{opacity:.4;cursor:default}.secondary{display:flex;justify-content:space-between;margin-top:20px}.secondary button{background:transparent;border:0;padding:8px}#message{min-height:24px;color:#9a453a}details{text-align:left;font-size:12px;margin-top:24px;overflow-wrap:anywhere}footer{text-align:center;color:#716e65;font-size:13px;line-height:1.8;margin-top:22px}#empty{padding:30px;text-align:center}
</style><main><header><h1>Audio check</h1><span id="position"></span></header><div class="filters"><select id="bank" aria-label="Language"><option value="">All languages</option></select><select id="scope" aria-label="Review queue"><option value="followup">Finish review</option><option value="triage-high">Priority listening</option><option value="triage-lower">Lower priority</option><option value="sample">Launch sample</option><option value="priority">Next review</option><option value="replacements">New replacements</option><option value="layer2">Second audit flags</option><option value="flagged">Flagged only</option><option value="all">All unreviewed</option><option value="reject">Rejected</option><option value="pass">Passed</option></select></div><div id="empty" hidden></div><section class="card" id="card"><div id="context"></div><h2 id="word"></h2><div id="ipa"></div><p id="meaning"></p><audio id="audio" controls preload="auto"></audio><div class="actions"><button id="reject">Reject · R</button><button id="pass" disabled>Pass · P</button></div><div class="secondary"><button id="undo" disabled>Undo</button><button id="skip">Skip →</button></div><p id="message" role="status"></p><p id="flags"></p><details><summary>Clip details</summary><p id="identity"></p></details></section><footer>Space: replay · P: pass · R: reject · →: skip<br>Decisions save on this Mac. Passing requires listening to the whole clip.</footer></main><script>
const $=id=>document.getElementById(id), names={'en-US-ga':'American English','en-GB-ssbe':'British English',fr:'French',de:'German',es:'Spanish',it:'Italian',zh:'Mandarin',pt:'Portuguese',ru:'Russian',ja:'Japanese'};
let clips=[],queue=[],current=null,last=null,saving=false,heard=false,covered=0,lastTime=0;
async function load(){const r=await fetch('/api/queue');const data=await r.json();clips=data.clips;for(const bank of [...new Set(clips.map(c=>c.bank))]){const o=document.createElement('option');o.value=bank;o.textContent=names[bank]||bank;$('bank').append(o);}const params=new URLSearchParams(location.search);$('scope').value=['sample','triage-high','triage-lower','followup'].includes(params.get('scope'))?params.get('scope'):'priority';if(params.get('bank'))$('bank').value=params.get('bank');refresh();}
function refresh(){queue=clips.filter(c=>(!$('bank').value||c.bank===$('bank').value)&&($('scope').value==='pass'||$('scope').value==='reject'?c.review===$('scope').value:c.review==='unreviewed'&&($('scope').value!=='followup'||c.nextReview)&&($('scope').value!=='triage-high'||['high','needs_audit'].includes(c.triage?.priority))&&($('scope').value!=='triage-lower'||c.triage?.priority==='lower')&&($('scope').value!=='sample'||c.launchSample)&&($('scope').value!=='flagged'||c.flags.length>0)&&($('scope').value!=='replacements'||c.replacement)&&($('scope').value!=='layer2'||c.layer2?.flags.length)&&($('scope').value!=='priority'||c.replacement||c.nextReview||c.layer2?.flags.some(f=>f.includes('repeat'))))).sort((a,b)=>Number(Boolean(b.customerReported))-Number(Boolean(a.customerReported))||($('scope').value==='priority'?Number(Boolean(b.replacement))-Number(Boolean(a.replacement)):$('scope').value==='flagged'?b.flags.length-a.flags.length:0));show(false);}
function show(autoplay=true){current=queue[0];heard=false;covered=0;lastTime=0;$('pass').disabled=true;$('message').textContent='';$('position').textContent=`${queue.length} left`;$('card').hidden=!current;$('empty').hidden=Boolean(current);if(!current){$('audio').pause();$('empty').textContent='This queue is complete.';return;}$('context').textContent=`${names[current.bank]||current.bank} · Voice ${current.voice}`;$('word').textContent=current.text;$('ipa').textContent=current.ipa;$('meaning').textContent=current.meaning||'';$('flags').textContent=(current.triage?current.triage.reason+' · ':'')+(current.flags.length?'Check: '+current.flags.map(f=>f.replaceAll('_',' ')).join(' · '):'');$('identity').textContent=`Clip ${current.id} · SHA ${current.sha}`+(current.layer2?' · Machine transcript: '+(current.layer2.transcript||'(none)'):'');$('audio').src='/audio/'+current.id;if(autoplay)$('audio').play().catch(()=>{$('message').textContent='Press play to listen.';});}
$('audio').ontimeupdate=()=>{const t=$('audio').currentTime,delta=t-lastTime;if(delta>0&&delta<.7)covered+=delta;lastTime=t;};$('audio').onseeking=()=>{lastTime=$('audio').currentTime;};$('audio').onended=()=>{if(covered>=$('audio').duration*.9){heard=true;$('pass').disabled=false;}};$('audio').onerror=()=>{$('message').textContent='Audio unavailable or changed. Run the scan again.';};
async function save(c,decision){const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-QA-Token':'__TOKEN__'},body:JSON.stringify({id:c.id,sha:c.sha,decision})});if(!r.ok)throw Error('Could not save. The clip may have changed; run the scan again.');}
async function decide(decision){if(!current||saving||(decision==='pass'&&!heard))return;saving=true;const reviewed=current;try{await save(reviewed,decision);last={clip:reviewed,previous:reviewed.review};reviewed.review=decision;$('undo').disabled=false;queue=queue.filter(c=>c.id!==reviewed.id);show();}catch(e){$('message').textContent=e.message;}finally{saving=false;}}
$('pass').onclick=()=>decide('pass');$('reject').onclick=()=>decide('reject');$('skip').onclick=()=>{if(saving||!current)return;queue.push(queue.shift());show();};$('undo').onclick=async()=>{if(!last||saving)return;saving=true;try{await save(last.clip,last.previous);last.clip.review=last.previous;queue=queue.filter(c=>c.id!==last.clip.id);queue.unshift(last.clip);last=null;$('undo').disabled=true;show();}catch(e){$('message').textContent=e.message;}finally{saving=false;}};
$('bank').onchange=$('scope').onchange=refresh;
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'){e.preventDefault();$('audio').currentTime=0;lastTime=0;covered=0;heard=false;$('pass').disabled=true;$('audio').play();}if(e.key.toLowerCase()==='p'){e.preventDefault();decide('pass');}if(e.key.toLowerCase()==='r'){e.preventDefault();decide('reject');}if(e.key==='ArrowRight'){e.preventDefault();$('skip').click();}});load().catch(e=>{$('message').textContent='Could not load the review queue.';});
</script></html>
