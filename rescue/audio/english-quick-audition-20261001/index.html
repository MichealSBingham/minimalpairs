<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English voice audition</title>
<style>body{font:16px/1.6 system-ui;background:#f4f3ed;color:#243630;max-width:900px;margin:auto;padding:30px}h1{font:44px Georgia,serif;margin-bottom:10px}p{color:#52665f}button{background:#225c50;color:white;border:0;padding:12px 17px;border-radius:7px;cursor:pointer}article{background:white;border:1px solid #d9e0d9;border-radius:12px;padding:20px;margin:15px 0}h2{margin:0 0 12px}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}audio{width:100%}small{display:block;color:#64756d}.word{font-size:22px}.pending{opacity:.55}@media(max-width:600px){section{grid-template-columns:1fr}body{padding:18px}}</style>
<h1>English voice audition</h1><p>Qwen CustomVoice · Ryan and Aiden · English explicitly selected.<br>These are local AI voices, awaiting pronunciation review.</p><p id="status">Starting the local generation job…</p><button id="reveal">Show words & IPA</button><main></main>
<script>
let visible=false,last='',data;const main=document.querySelector('main');
document.querySelector('#reveal').onclick=()=>{visible=!visible;document.querySelector('#reveal').textContent=visible?'Hide words & IPA':'Show words & IPA';render()};
function render(){if(!data)return;main.replaceChildren();const groups=Map.groupBy(data.clips,c=>c.wordId);let n=0;for(const clips of groups.values()){n++;let a=document.createElement('article'),h=document.createElement('h2');h.textContent=visible?clips[0].text+'  '+clips[0].ipa:'Word sample '+n;a.append(h);let s=document.createElement('section');for(const c of clips){let d=document.createElement('div'),label=document.createElement('b');label.textContent=c.speaker;d.append(label);if(c.sha256){let audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=c.url;audio.onplay=()=>document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()});d.append(audio)}else{let p=document.createElement('p');p.textContent=c.technicalStatus==='failed'?'Generation failed':'Generating…';d.append(p)}let note=document.createElement('small');note.textContent=c.technicalStatus==='needs-review'?'Technical flag: '+(c.technicalFlags||[]).join(', '):'Pronunciation not yet approved';d.append(note);s.append(d)}a.append(s);main.append(a)}}
async function update(){try{let r=await fetch('manifest.json?t='+Date.now());if(!r.ok)return;data=await r.json();document.querySelector('#status').textContent=data.status==='complete'?'Generation finished: '+data.clips.filter(c=>c.sha256).length+' recordings.':data.status+' · '+(data.completed||0)+' / '+data.clips.length+' recordings';let signature=JSON.stringify(data.clips.map(c=>[c.sha256,c.technicalStatus]));if(signature!==last&&![...document.querySelectorAll('audio')].some(a=>!a.paused)){last=signature;render()}if(data.status==='complete'||data.status==='failed')clearInterval(timer)}catch(e){}}
const timer=setInterval(update,3000);update();
</script></html>
